<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
  <meta name="theme-color" content="#0067c5" />
  <title>Windows Simulator for Education V2.1</title>
  <link rel="stylesheet" href="/styles.css?v=2.2.2" />
</head>
<body>
  <div id="app" class="os-win11">
    <div id="desktop" class="desktop" tabindex="0" aria-label="Windows desktop">
      <div id="desktop-icons" class="desktop-icons"></div>
      <div id="window-layer" class="window-layer"></div>
      <div id="selection-rect" class="selection-rect hidden"></div>
    </div>

    <div id="taskbar" class="taskbar">
      <div class="taskbar-main">
        <button id="start-btn" class="task-icon start-button" title="Start"><img src="/assets/win11/icons/start.svg" alt="" /></button>
        <button id="search-btn" class="task-icon search-task" title="Search"><img src="/assets/win11/icons/search.svg" alt="" /></button>
        <button class="task-icon pinned-app" data-app="explorer" title="File Explorer"><img src="/assets/win11/icons/explorer.svg" alt="" /></button>
        <button class="task-icon pinned-app" data-app="notepad" title="Notepad"><img src="/assets/win11/icons/notepad.svg" alt="" /></button>
        <button class="task-icon pinned-app" data-app="calculator" title="Calculator"><img src="/assets/win11/icons/calculator.svg" alt="" /></button>
        <div id="running-apps" class="running-apps"></div>
      </div>
      <div class="taskbar-system">
        <button id="quick-btn" class="tray-icons" title="Quick settings">
          <img src="/assets/win11/icons/wifi.svg" alt="" /><img src="/assets/win11/icons/volume.svg" alt="" />
        </button>
        <button id="clock-btn" class="clock"><span id="clock-time"></span><span id="clock-date"></span></button>
        <button id="show-desktop" class="show-desktop" title="Show desktop"></button>
      </div>
    </div>

    <section id="start-menu" class="start-menu hidden" aria-label="Start menu"></section>
    <section id="search-panel" class="search-panel hidden"></section>
    <section id="quick-panel" class="quick-panel hidden"></section>
    <div id="context-menu" class="context-menu hidden"></div>
    <div id="properties-modal" class="modal-backdrop hidden"></div>
    <div id="dialog-modal" class="modal-backdrop hidden"></div>
    <div id="celebration-modal" class="modal-backdrop hidden"></div>
    <aside id="teacher-panel" class="teacher-panel hidden"></aside>
    <aside id="mission-panel" class="mission-panel"></aside>
    <div id="toast" class="toast hidden"></div>
    <div id="boot-screen" class="boot-screen hidden"></div>
    <div id="first-run" class="first-run hidden"></div>
  </div>
  <script type="module" src="/app.js?v=2.2.2"></script>
</body>
</html>
